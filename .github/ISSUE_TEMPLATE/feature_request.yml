name: "功能或改进建议"
description: "提出玩法、工具、文档或仓库规范的改进。"
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: "请先搜索已有 Issue。游戏代码实现前需先完成影响分析，并获得维护者确认。"
  - type: textarea
    id: problem
    attributes:
      label: "要解决的问题"
      description: "描述具体使用场景，以及当前遇到的限制。"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "期望的行为"
      description: "说明完成后应如何使用；如有替代方案或参考资料，可一起提供。"
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: "影响分析"
      description: "可能影响哪些系统？是否需要调整 FSM 结构或新增状态？不涉及游戏代码可填写“不适用”，不确定时请说明。"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "验收方式"
      description: "列出可观察的完成条件，以及需要执行的检查或 Unity 运行验证。"
    validations:
      required: true
